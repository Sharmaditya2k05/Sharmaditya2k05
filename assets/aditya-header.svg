<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Aditya Sharma — AI, ML and Software Developer</title><desc id="desc">Animated smart-city profile banner with flowing data signals.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#030712"/><stop offset="52%" stop-color="#082F49"/><stop offset="100%" stop-color="#134E4A"/><animate attributeName="x2" values="1;0.78;1" dur="10s" repeatCount="indefinite"/></linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22D3EE"/><stop offset="50%" stop-color="#2DD4BF"/><stop offset="100%" stop-color="#FACC15"/></linearGradient>
    <radialGradient id="leftGlow"><stop offset="0%" stop-color="#0891B2" stop-opacity="0.55"/><stop offset="100%" stop-color="#0891B2" stop-opacity="0"/></radialGradient>
    <radialGradient id="rightGlow"><stop offset="0%" stop-color="#14B8A6" stop-opacity="0.42"/><stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/></radialGradient>
    <pattern id="microgrid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#A5F3FC" stroke-width="0.55" opacity="0.06"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="330" rx="24" fill="url(#night)"/><rect width="1200" height="330" rx="24" fill="url(#microgrid)"/>
  <circle cx="90" cy="85" r="250" fill="url(#leftGlow)"><animate attributeName="r" values="220;270;220" dur="8s" repeatCount="indefinite"/></circle>
  <circle cx="1115" cy="235" r="270" fill="url(#rightGlow)"><animate attributeName="r" values="270;225;270" dur="9s" repeatCount="indefinite"/></circle>
  <g opacity="0.48" fill="#0B2539" stroke="#2DD4BF" stroke-width="1"><path d="M0 303V258H55V222H92V278H134V196H178V253H220V232H272V303Z"/><path d="M928 303V244H968V205H1010V269H1056V180H1095V236H1140V215H1200V303Z"/></g>
  <g fill="#5EEAD4" opacity="0.7"><rect x="72" y="239" width="5" height="6"/><rect x="149" y="213" width="5" height="6"/><rect x="191" y="267" width="5" height="6"/><rect x="985" y="224" width="5" height="6"/><rect x="1072" y="198" width="5" height="6"/><rect x="1156" y="234" width="5" height="6"/><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.8s" repeatCount="indefinite"/></g>
  <path d="M75 145 C215 72 340 190 480 116 S760 58 900 126 1045 177 1130 118" fill="none" stroke="url(#signal)" stroke-width="2" opacity="0.8" stroke-dasharray="8 12"><animate attributeName="stroke-dashoffset" from="0" to="-100" dur="6s" repeatCount="indefinite"/></path>
  <g filter="url(#glow)"><circle r="5" fill="#22D3EE"><animateMotion dur="6.5s" repeatCount="indefinite" path="M75 145 C215 72 340 190 480 116 S760 58 900 126 1045 177 1130 118"/></circle><circle r="5" fill="#FACC15"><animateMotion dur="7.5s" begin="-2.5s" repeatCount="indefinite" path="M1130 118 C1010 190 880 76 735 135 S455 190 320 112 175 72 75 145"/></circle></g>
  <g transform="translate(600 87)" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif"><text y="0" fill="#67E8F9" font-size="14" font-weight="700" letter-spacing="5">HELLO, I'M</text><text y="70" fill="#FFFFFF" font-size="59" font-weight="800">Aditya Sharma</text><rect x="-250" y="91" width="500" height="3" rx="2" fill="url(#signal)"><animate attributeName="width" values="130;500;130" dur="6.5s" repeatCount="indefinite"/><animate attributeName="x" values="-65;-250;-65" dur="6.5s" repeatCount="indefinite"/></rect><text y="132" fill="#CCFBF1" font-size="21" font-weight="500" letter-spacing="1">AI/ML · Software Development · Intelligent Systems</text></g>
  <g transform="translate(600 273)" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="700"><g transform="translate(-294 0)"><rect x="-74" y="-20" width="148" height="40" rx="20" fill="#082F49" stroke="#22D3EE"/><text y="5" fill="#CFFAFE">SMART CITIES</text></g><g transform="translate(-99 0)"><rect x="-76" y="-20" width="152" height="40" rx="20" fill="#0D3646" stroke="#2DD4BF"/><text y="5" fill="#CCFBF1">COMPUTER VISION</text></g><g transform="translate(91 0)"><rect x="-64" y="-20" width="128" height="40" rx="20" fill="#10433E" stroke="#5EEAD4"/><text y="5" fill="#CCFBF1">APPLIED AI</text></g><g transform="translate(290 0)"><rect x="-82" y="-20" width="164" height="40" rx="20" fill="#3B451E" stroke="#FACC15"/><text y="5" fill="#FEF9C3">APP DEVELOPMENT</text></g></g>
</svg>
